<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <div id="header-content"></div>

    <h1 id="title_login"> Login </h2>

        <div>
            <input class="logs" id="cpf" type="text" placeholder="CPF" required>
            <input class="logs" id="senha" type="password" placeholder="SENHA" required>
            <button class="login_cliente" type="submit">Fazer Login</button>
            <h3 style="text-align: center; margin-right: 50px;">Não possui conta?</h3>
            <button class="login_cliente"><a href="cadastroPaciente.html" style="text-decoration: none; color: white;">Cadastro</a></button>
        </div>

     
        <div id="rodape-content"></div>
        <script type="module" src="../js/login.js"></script>
        <script>
            async function loadHeader() {
                const response = await fetch('../contents/header.html');
                const headerHTML = await response.text();
                document.getElementById('header-content').innerHTML = headerHTML;
            }
            loadHeader();
            async function loadRodape() {
                const response = await fetch('../contents/rodape.html');
                const footerHTML = await response.text();
                document.getElementById('rodape-content').innerHTML = footerHTML;
            }
            loadRodape();
        </script>
</body>

</html>
