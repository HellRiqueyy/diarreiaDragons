<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/reset.css">
</head>

<body>

    <div id="header-content"></div>
    <div class="container">
        <h1>Cadastro Médico</h1>

        <input class="input" id="nome" type="text" placeholder="NOME COMPLETO">
        <input class="input" id="cpf" type="text" placeholder="CPF">
        <input class="input" id="telefone" type="text" placeholder="TELEFONE DA CLINICA OU CONSULTORIO">
        <input class="input" id="nomeClinica" type="text" placeholder="NOME DA CLINICA OU CONSULTORIO">
        <input class="input" id="enderecoClinica" type="text" placeholder="ENDEREÇO DA CLINICA OU CONSULTORIO">
        <input class="input" id="email" type="email" placeholder="EMAIL">
        <input class="input" id="senha" type="password" placeholder="SENHA">

        <div class="input">
            <label for="especialidade">Selecione a sua especialidade</label>
            <select id="especialidade" name="especialidade">
                <option id="especialidade"></option>
                <option id="especialidade">Alergia e Imunologia</option>
                <option id="especialidade">Anestesiologia</option>
                <option id="especialidade">Angiologia</option>
                <option id="especialidade">Cardiologia</option>
                <option id="especialidade">Cirurgia Cardiovascular</option>
                <option id="especialidade">Cirurgia da Mão</option>
                <option id="especialidade">Cirurgia de Cabeça e Pescoço</option>
                <option id="especialidade">Cirurgia Geral</option>
                <option id="especialidade">Cirurgia Pediátrica</option>
                <option id="especialidade">Cirurgia Plástica</option>
                <option id="especialidade">Cirurgia Torácica</option>
                <option id="especialidade">Cirurgia Vascular</option>
                <option id="especialidade">Coloproctologia</option>
                <option id="especialidade">Dermatologia</option>
                <option id="especialidade">Endocrinologia e Metabologia</option>
                <option id="especialidade">Gastroenterologia</option>
                <option id="especialidade">Genética Médica</option>
                <option id="especialidade">Geriatria</option>
                <option id="especialidade">Ginecologia e Obstetrícia</option>
                <option id="especialidade">Hematologia</option>
                <option id="especialidade">Hepatologia</option>
                <option id="especialidade">Infectologia</option>
                <option id="especialidade">Mastologia</option>
                <option id="especialidade">Medicina de Emergência</option>
                <option id="especialidade">Medicina de Família e Comunidade</option>
                <option id="especialidade">Medicina do Esporte</option>
                <option id="especialidade">Medicina do Trabalho</option>
                <option id="especialidade">Medicina Física e Reabilitação</option>
                <option id="especialidade">Medicina Intensiva</option>
                <option id="especialidade">Medicina Legal e Perícia Médica</option>
                <option id="especialidade">Medicina Nuclear</option>
                <option id="especialidade">Medicina Preventiva e Social</option>
                <option id="especialidade">Nefrologia</option>
                <option id="especialidade">Neurocirurgia</option>
                <option id="especialidade">Neurologia</option>
                <option id="especialidade">Nutrologia</option>
                <option id="especialidade">Oftalmologia</option>
                <option id="especialidade">Oncologia</option>
                <option id="especialidade">Ortopedia e Traumatologia</option>
                <option id="especialidade">Otorrinolaringologia</option>
                <option id="especialidade">Patologia</option>
                <option id="especialidade">Pediatria</option>
                <option id="especialidade">Pneumologia</option>
                <option id="especialidade">Psiquiatria</option>
                <option id="especialidade">Radiologia e Diagnóstico por Imagem</option>
                <option id="especialidade">Reumatologia</option>
                <option id="especialidade">Urologia</option>
            </select>
        </div>
        <label class="uploads">
            <input id="upload-crm" type="file">
            Faça o upload do seu CRM
        </label>
        <fieldset class="input">
            <legend>Disponibilidade - Dias da semana</legend>
            <div class="dias-checkboxes">
                <label for="dia-seg"><input type="checkbox" name="dias" value="segunda" id="dia-seg"> Segunda</label>
                <label for="dia-ter"><input type="checkbox" name="dias" value="terca" id="dia-ter"> Terça</label>
                <label for="dia-qua"><input type="checkbox" name="dias" value="quarta" id="dia-qua"> Quarta</label>
                <label for="dia-qui"><input type="checkbox" name="dias" value="quinta" id="dia-qui"> Quinta</label>
                <label for="dia-sex"><input type="checkbox" name="dias" value="sexta" id="dia-sex"> Sexta</label>
                <label for="dia-sab"><input type="checkbox" name="dias" value="sabado" id="dia-sab"> Sábado</label>
                <label for="dia-dom"><input type="checkbox" name="dias" value="domingo" id="dia-dom"> Domingo</label>
            </div>
            <div id="dias-error" class="error" aria-live="polite" style="color:crimson; font-size:0.9em; display:none;">
                Selecione pelo menos um dia.</div>
        </fieldset>



        <!-- Horários (gerados via JS) -->
        <fieldset class="input" id="horarios-fieldset" style="margin-top:12px;">
            <legend>Horários (de 08:00 a 17:00 — intervalo 30min)</legend>
            <label><input type="checkbox" id="horario-todos"> Selecionar todos horários</label>
            <div class="horarios-checkboxes" id="horarios-container"
                style="margin-top:8px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px 10px;"></div>
            <div id="horarios-error" class="error" aria-live="polite"
                style="color:crimson; font-size:0.9em; display:none;">Selecione pelo menos um horário.</div>
        </fieldset>

        <button id="btnEnviar" class="btn">Cadastrar</button>
    </div>
    <div id="rodape-content"></div>

    <script type="module" src="../js/cadastroMedico.js"></script>
    <script type="module" src="../js/cadastroAgenda.js"></script>

    <script>
        // Carregar Header
        async function loadHeader() {
            const response = await fetch('../contents/header.html');
            document.getElementById('header-content').innerHTML = await response.text();
        }
        loadHeader();

        // Carregar Rodapé
        async function loadRodape() {
            const response = await fetch('../contents/rodape.html');
            document.getElementById('rodape-content').innerHTML = await response.text();
        }
        loadRodape();

    </script>

</body>

</html>
