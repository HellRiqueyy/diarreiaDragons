<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .horarios-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px
        }

        @media(max-width:700px) {
            .horarios-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:420px) {
            .horarios-grid {
                grid-template-columns: 1fr;
            }
        }

        .horario-btn.selected {
            background: #08CB00;
            color: #fff;
            border-color: #08CB00
        }
    </style>
</head>

<body>
    <div id="header-content"></div>

    <div class="container py-4">
        <h2>Agendar Consulta</h2>
        <div id="medico-card" class="card p-3 mb-3" style="max-width:720px;">
            <div><strong id="medico-nome">—</strong></div>
            <div id="medico-espec" style="font-size:0.95rem;color:#666"></div>
            <div id="medico-telefone" style="margin-top:6px;color:#444"></div>
        </div>


        <form id="form-agenda" style="max-width:720px;">
            <div class="mb-3">
                <label class="form-label">Data</label>
                <input id="consulta-data" type="date" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Horários disponíveis</label>
                <div id="horarios-container" class="horarios-grid"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Horário selecionado</label>
                <input id="consulta-hora" type="text" class="form-control" readonly required>
            </div>

            <div class="mb-3">
                <label class="form-label">Seu nome</label>
                <input id="paciente-nome" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Seu CPF</label>
                <input id="paciente-cpf" class="form-control">
            </div>
            <button id="btn-agendar" class="btn btn-primary" type="submit">Confirmar Agendamento</button>
        </form>

        <div id="msg" style="margin-top:12px;" aria-live="polite"></div>
    </div>
    <div class="recomendacao">

        <section id="recomendacoes-section" style="max-width:720px;margin-bottom:16px;">
            <h4 style="font-size:1rem;margin-bottom:8px;">Outros médicos desta especialidade</h4>
            <div id="recomendacoes-cadastro" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
        </section>
    </div>

    <div id="rodape-content"></div>

    <script type="module" src="../js/cadastroConsulta.js"></script>
    <script>
        async function loadHeader() {
            const response = await fetch('../contents/header.html');
            document.getElementById('header-content').innerHTML = await response.text();
        }
        loadHeader();
        async function loadRodape() {
            const response = await fetch('../contents/rodape.html');
            document.getElementById('rodape-content').innerHTML = await response.text();
        }
        loadRodape();
    </script>
</body>

</html>
